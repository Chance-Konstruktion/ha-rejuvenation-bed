[pytest]
# Der Attrappen-Lauf, und nur der.
#
# Ohne diese Zeile sammelt pytest alles ein, was nach Test aussieht --
# also auch tests_ha/. Die beiden vertragen sich nicht: die conftest.py in
# tests/ ersetzt das Paket ``homeassistant`` in sys.modules durch
# Attrappen, die in tests_ha/ setzt eine echte Instanz auf. Im selben Lauf
# gewinnt, wer zuerst importiert wird, und der andere bricht ab.
#
# tests_ha/ laeuft mit pytest-ha.ini in einem eigenen CI-Job.
testpaths = tests
asyncio_mode = auto
