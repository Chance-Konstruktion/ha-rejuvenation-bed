      <path d="M 40 12 q 4 -6 8 0 t 8 0 t 8 0 t 8 0" opacity="0.55"></path>
      <path d="M 36 6  q 4 -6 8 0 t 8 0 t 8 0 t 8 0 t 8 0" opacity="0.35"></path>
