    </filter>

    <filter id="curveBlur" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="6"></feGaussianBlur>
    </filter>
  </defs>

  
  <rect width="1280" height="420" fill="url(#bg)"></rect>
  <rect width="1280" height="420" fill="url(#dots)"></rect>
  <rect width="1280" height="420" fill="url(#glowSun)"></rect>
  <rect width="1280" height="420" fill="url(#glowMoon)"></rect>

  
  <rect x="0.5" y="0.5" width="1279" height="419" fill="none" stroke="#2a2218" stroke-width="1"></rect>

  
  <g opacity="0.85">
    
    <path d="M 0 240 C 120 240, 180 130, 320 130 S 540 320, 720 320 S 1000 100, 1280 100" fill="none" stroke="#E8A33D" stroke-width="2" opacity="0.35" filter="url(#curveBlur)"></path>
    
    <path d="M 0 240 C 120 240, 180 130, 320 130 S 540 320, 720 320 S 1000 100, 1280 100" fill="none" stroke="url(#curveStroke)" stroke-width="1.4"></path>
    
    <path d="M 0 240 C 120 240, 180 130, 320 130 S 540 320, 720 320 S 1000 100, 1280 100 L 1280 420 L 0 420 Z" fill="url(#curveFill)" opacity="0.5"></path>

    
