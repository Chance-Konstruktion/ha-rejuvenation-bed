  <g transform="translate(72, 64)" font-family="ui-monospace, &#39;SF Mono&#39;, &#39;Roboto Mono&#39;, Menlo, monospace" font-size="11" fill="#8b7355" letter-spacing="2.2">
    <text y="0">HACS · v0.7.2 · BIORHYTHM · LOCAL-FIRST · OPEN SOURCE</text>
