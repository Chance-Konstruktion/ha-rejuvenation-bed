    <text y="0" font-family="Georgia, &#39;Cormorant Garamond&#39;, &#39;Times New Roman&#39;, serif" font-size="92" font-weight="700" fill="url(#titleGrad)" letter-spacing="-2">Rejuvenation</text>
    <text y="78" font-family="Georgia, &#39;Cormorant Garamond&#39;, &#39;Times New Roman&#39;, serif" font-size="92" font-weight="700" fill="url(#titleGrad)" letter-spacing="-2">Bed</text>
    
