      <circle cx="18" cy="14" r="4" fill="none" stroke="#E8A33D" stroke-width="1.4"></circle>
      <g stroke="#E8A33D" stroke-width="1.2" stroke-linecap="round">
        <line x1="18" y1="6" x2="18" y2="3"></line>
        <line x1="18" y1="22" x2="18" y2="25"></line>
