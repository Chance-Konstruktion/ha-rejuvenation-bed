<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Rejuvenation Bed">
  <defs>
    
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1410"></stop>
      <stop offset="50%" stop-color="#13100c"></stop>
      <stop offset="100%" stop-color="#0c0907"></stop>
    </linearGradient>

    
    <radialGradient id="glowSun" cx="0.85" cy="0.65" r="0.5">
      <stop offset="0%" stop-color="#E8A33D" stop-opacity="0.22"></stop>
      <stop offset="60%" stop-color="#B47326" stop-opacity="0.06"></stop>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"></stop>
    </radialGradient>

    
    <radialGradient id="glowMoon" cx="0.12" cy="0.3" r="0.4">
      <stop offset="0%" stop-color="#7a6b58" stop-opacity="0.16"></stop>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"></stop>
    </radialGradient>

    
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#B47326"></stop>
      <stop offset="45%" stop-color="#F5C56B"></stop>
      <stop offset="75%" stop-color="#E8A33D"></stop>
      <stop offset="100%" stop-color="#B47326"></stop>
    </linearGradient>

    <linearGradient id="curveStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a4a38" stop-opacity="0.4"></stop>
      <stop offset="35%" stop-color="#8b6b3a" stop-opacity="0.9"></stop>
      <stop offset="65%" stop-color="#E8A33D" stop-opacity="0.95"></stop>
      <stop offset="100%" stop-color="#F5C56B" stop-opacity="0.6"></stop>
