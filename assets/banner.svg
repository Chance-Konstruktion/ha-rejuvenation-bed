    <linearGradient id="curveFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8A33D" stop-opacity="0.18"></stop>
      <stop offset="100%" stop-color="#E8A33D" stop-opacity="0"></stop>
    </linearGradient>

    
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#3a2e22" opacity="0.55"></circle>
    </pattern>

    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
