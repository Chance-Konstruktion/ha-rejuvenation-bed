    <text x="90" y="142" text-anchor="middle" font-family="ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="10" fill="#8b7355" letter-spacing="1.6">29.4 °C · ZONE A</text>
  </g>

  
  <g transform="translate(72, 348)" font-family="ui-monospace, &#39;SF Mono&#39;, &#39;Roboto Mono&#39;, Menlo, monospace" font-size="11" letter-spacing="1.4" fill="#E0CFA6">
    
    <g>
