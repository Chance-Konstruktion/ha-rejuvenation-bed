# Diese Datei bindet die gemeinsame Vorlage ein, statt sie zu kopieren.
#
# Frueher lag hier die vollstaendige Vorlage, in jedem Repository ein Mal,
# und ein eigener Job verglich sie byteweise mit der Quelle -- weil zweimal
# ein Job still verschwunden war. Eingebunden kann sie nicht abweichen,
# also braucht es den Vergleich nicht mehr.
#
# `ref` zeigt auf ein Etikett, nicht auf main: Ein Commit in der Vorlage
# aendert hier nichts. Erst wenn das Etikett bewusst weitergesetzt wird,
# wirkt eine Aenderung -- und dann ueberall zugleich.
#
# Die Vorlage: https://gitlab.schanz.ipv64.net/claude/ci-vorlagen
# Was sie mitbringt: pytest, pytest-ha, hassfest, hacs-angaben, release,
# pytest-hardware, pages und die Geheimnis-Suche. Jeder Job hat eine
# `exists`-Regel und laeuft nur, wenn es hier etwas fuer ihn zu tun gibt.

include:
  - project: 'claude/ci-vorlagen'
    file: '/vorlagen/standard.yml'
    ref: 'standard-v1'

# ── Black, wie drueben ────────────────────────────────────────────────
# Der Lint-Workflow auf GitHub laesst black mit --line-length 120 laufen.
# Bis eben war das die einzige Stelle, an der dieses Repo auf Formatierung
# geprueft wurde -- also fiel ein Verstoss erst auf der Ladentheke auf,
# lange nachdem er hier entstanden war. Genau so ist der Lauf vom
# 05.09.2026 rot geworden.
#
# Dieser Job steht bewusst nur hier und nicht in der gemeinsamen Vorlage:
# von den vierzehn gespiegelten Repositories hat einzig dieses einen
# Black-Workflow drueben. Ein Job in der Vorlage haette die anderen
# dreizehn sofort rot gemacht, ohne dass es dort jemanden interessiert --
# zusammen ueber 250 Dateien.
#
# Die Fassung ist festgenagelt, hier wie drueben. Mit `pip install black`
# ohne Angabe formatiert eine neue Fassung anders, und ein Repo, das
# gestern gruen war, ist heute rot, ohne dass jemand eine Zeile
# angefasst hat.
black:
  stage: test
  image: python:3.12-slim
  script:
    - pip install --quiet "black==26.5.1"
    - black --version
    - black --check --diff --line-length 120 custom_components/ tests/
  rules:
    - exists:
        - custom_components/**/*.py


# ── Wear OS / Galaxy Watch App ────────────────────────────────────────
# Only runs when the dedicated watch module changes. The SDK image already
# contains Android command-line tools; API 37 is installed explicitly so
# compileSdk and the CI environment cannot silently drift apart.
android-watch:
  stage: test
  image: ghcr.io/cirruslabs/android-sdk:36
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  cache:
    key: "android-watch-gradle"
    paths:
      - .gradle/caches/
  script:
    - apt-get update -qq && apt-get install -y -qq curl unzip
    - SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk-linux}}"
    - sdkmanager --sdk_root="$SDK_ROOT" --licenses < <(yes)
    # Android 17 API 37 is published on the Canary channel as android-37.0.
    - sdkmanager --sdk_root="$SDK_ROOT" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
    # AGP 9.1 resolves compileSdk 37 using the android-37 directory name.
    - ln -sfn android-37.0 "$SDK_ROOT/platforms/android-37"
    - test -d "$SDK_ROOT/platforms/android-37"
    - curl --fail --location --silent --show-error "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip" --output /tmp/gradle.zip
    - unzip -q /tmp/gradle.zip -d /tmp
    - /tmp/gradle-9.3.1/bin/gradle --no-daemon --stacktrace -p watch :app:assembleDebug :app:testDebugUnitTest
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit:
        - watch/app/build/test-results/testDebugUnitTest/TEST-*.xml
    paths:
      - watch/app/build/outputs/apk/debug/
      - watch/app/build/reports/tests/testDebugUnitTest/
  rules:
    - changes:
        - watch/**/*
