# ─────────────────────────────────────────────────────────────────────────────
#  Rejuvenation Bed · Nightstand Cockpit
# ─────────────────────────────────────────────────────────────────────────────
#  Schlankes Lovelace-Dashboard für den Nachttisch — nur die Essenz:
#  Bett-Status, Wecker, Licht, Sondermodi.  Im selben Bernstein-Stil wie das
#  HTML "Premium Nightstand Dashboard".
#
#  Tipp: Wer den Radio-Wecker-Look will, nutzt das HTML-File aus diesem Ordner
#  als Panel-iFrame.  Dieses YAML ist die native HA-Variante.
#
#  Alle Karten sind `conditional`: nicht vorhandene Entitäten verschwinden
#  einfach — du musst nichts wegkommentieren.
# ─────────────────────────────────────────────────────────────────────────────

title: Rejuvenation Bed
views:
  - title: Nightstand
    path: nightstand
    icon: mdi:bed-clock
    type: sections
    max_columns: 2
    cards:
      # ════════════════════════════════════════════════════════ CLOCK ══
      - type: heading
        heading: Nightstand
        heading_style: title
        icon: mdi:alarm

      - type: clock
        clock_size: large

      - type: conditional
        conditions:
          - entity: sensor.next_alarm
            state_not: unavailable
        card:
          type: tile
          entity: sensor.next_alarm
          name: Wecker
          color: amber
          icon: mdi:alarm-bell

      # ════════════════════════════════════════════════════════ BED ══
      - type: heading
        heading: Bett
        icon: mdi:bed-outline

      - type: conditional
        conditions:
          - entity: climate.rejuvenation_bed_links
            state_not: unavailable
        card:
          type: thermostat
          entity: climate.rejuvenation_bed_links
          name: Links
          features:
            - type: climate-hvac-modes
              hvac_modes:
                - heat
                - "off"

      - type: conditional
        conditions:
          - entity: climate.rejuvenation_bed_rechts
            state_not: unavailable
        card:
          type: thermostat
          entity: climate.rejuvenation_bed_rechts
          name: Rechts
          features:
            - type: climate-hvac-modes
              hvac_modes:
                - heat
                - "off"

      # ─── Präsenz ───────────────────────────────────────────────────
      - type: conditional
        conditions:
          - entity: binary_sensor.bett_links_belegung
            state_not: unavailable
        card:
          type: tile
          entity: binary_sensor.bett_links_belegung
          name: Präsenz Links
          color: amber
          icon: mdi:account-circle
          state_content:
            - state
            - last-changed

      - type: conditional
        conditions:
          - entity: binary_sensor.bett_rechts_belegung
            state_not: unavailable
        card:
          type: tile
          entity: binary_sensor.bett_rechts_belegung
          name: Präsenz Rechts
          color: amber
          icon: mdi:account-circle
          state_content:
            - state
            - last-changed

      # ════════════════════════════════════════════════════════ LIGHT ══
      - type: heading
        heading: Licht
        icon: mdi:lightbulb-outline

      - type: conditional
        conditions:
          - entity: light.nachttisch
            state_not: unavailable
        card:
          type: tile
          entity: light.nachttisch
          name: Nachttisch
          color: amber
          icon: mdi:lamp
          features:
            - type: light-brightness

      - type: conditional
        conditions:
          - entity: light.schlafzimmer_ambient
            state_not: unavailable
        card:
          type: tile
          entity: light.schlafzimmer_ambient
          name: Ambiente
          color: amber
          icon: mdi:wall-sconce
          features:
            - type: light-brightness

      # ════════════════════════════════════════════════════ MODI ══
      - type: heading
        heading: Sondermodi
        icon: mdi:weather-night

      - type: conditional
        conditions:
          - entity: switch.bett_links_schnellheizen
            state_not: unavailable
        card:
          type: tile
          entity: switch.bett_links_schnellheizen
          name: Boost Links
          color: amber
          icon: mdi:rocket-launch

      - type: conditional
        conditions:
          - entity: switch.bett_rechts_schnellheizen
            state_not: unavailable
        card:
          type: tile
          entity: switch.bett_rechts_schnellheizen
          name: Boost Rechts
          color: amber
          icon: mdi:rocket-launch

      - type: conditional
        conditions:
          - entity: switch.bett_links_krank_modus
            state_not: unavailable
        card:
          type: tile
          entity: switch.bett_links_krank_modus
          name: Krank Links
          color: red
          icon: mdi:thermometer

      - type: conditional
        conditions:
          - entity: switch.bett_rechts_krank_modus
            state_not: unavailable
        card:
          type: tile
          entity: switch.bett_rechts_krank_modus
          name: Krank Rechts
          color: red
          icon: mdi:thermometer

      - type: conditional
        conditions:
          - entity: switch.bett_urlaub_modus
            state_not: unavailable
        card:
          type: tile
          entity: switch.bett_urlaub_modus
          name: Urlaub
          color: amber
          icon: mdi:airplane

      # ═════════════════════════════════════════════════ SETTINGS ══
      # Optional: Schnellzugriff auf Energie/Schlaf — nur sichtbar wenn da.
      - type: heading
        heading: Status
        icon: mdi:chart-line

      - type: conditional
        conditions:
          - entity: sensor.bett_schlafscore_links
            state_not: unavailable
        card:
          type: tile
          entity: sensor.bett_schlafscore_links
          name: Score Links
          color: amber
          icon: mdi:sleep

      - type: conditional
        conditions:
          - entity: sensor.bett_schlafscore_rechts
            state_not: unavailable
        card:
          type: tile
          entity: sensor.bett_schlafscore_rechts
          name: Score Rechts
          color: amber
          icon: mdi:sleep

      - type: conditional
        conditions:
          - entity: sensor.bett_heutiger_verbrauch
            state_not: unavailable
        card:
          type: tile
          entity: sensor.bett_heutiger_verbrauch
          name: Verbrauch heute
          color: amber
          icon: mdi:flash

      - type: conditional
        conditions:
          - entity: sensor.bett_solar_anteil_heute
            state_not: unavailable
        card:
          type: tile
          entity: sensor.bett_solar_anteil_heute
          name: Solar heute
          color: amber
          icon: mdi:solar-power
