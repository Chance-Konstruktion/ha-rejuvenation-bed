title: Rejuvenation Bed Cockpit
views:
  - title: Nacht-Cockpit
    path: rejuvenation-bed-night
    icon: mdi:bed-outline
    type: sections
    max_columns: 2
    cards:
      - type: heading
        heading: Rejuvenation Bed · Nachtmodus
        heading_style: title
        icon: mdi:bed-outline

      - type: markdown
        content: >-
          ⚙️ Diese Vorlage ist absichtlich **optional aufgebaut**.
          Passe die Entity-IDs an deine Installation an.
          Nicht verfügbare Karten bleiben über `conditional` verborgen.

      # === Bett-Thermostat Links ===
      - type: conditional
        conditions:
          - entity: climate.rejuvenation_bed_links
            state_not: unavailable
        card:
          type: tile
          entity: climate.rejuvenation_bed_links
          name: Bett Links Thermostat
          features_position: bottom
          state_content:
            - state
            - current_temperature
          tap_action:
            action: more-info

      - type: conditional
        conditions:
          - entity: climate.rejuvenation_bed_links
            state_not: unavailable
        card:
          type: thermostat
          entity: climate.rejuvenation_bed_links
          name: Bettseite Links

      # === Bett-Thermostat Rechts ===
      - type: conditional
        conditions:
          - entity: climate.rejuvenation_bed_rechts
            state_not: unavailable
        card:
          type: tile
          entity: climate.rejuvenation_bed_rechts
          name: Bett Rechts Thermostat
          features_position: bottom
          state_content:
            - state
            - current_temperature
          tap_action:
            action: more-info

      - type: conditional
        conditions:
          - entity: climate.rejuvenation_bed_rechts
            state_not: unavailable
        card:
          type: thermostat
          entity: climate.rejuvenation_bed_rechts
          name: Bettseite Rechts

      - type: heading
        heading: Nachttisch
        icon: mdi:alarm

      - type: clock
        clock_size: medium

      # === Wecker / Licht (komplett optional) ===
      - type: conditional
        conditions:
          - entity: sensor.next_alarm
            state_not: unavailable
        card:
          type: tile
          entity: sensor.next_alarm
          name: Nächster Wecker
          color: amber

      - type: conditional
        conditions:
          - entity: input_datetime.bedroom_alarm
            state_not: unavailable
        card:
          type: tile
          entity: input_datetime.bedroom_alarm
          name: Wecker-Zeit
          color: amber

      - type: conditional
        conditions:
          - entity: light.nachttisch
            state_not: unavailable
        card:
          type: tile
          entity: light.nachttisch
          name: Nachttischlicht
          color: amber

      - type: conditional
        conditions:
          - entity: light.schlafzimmer_ambient
            state_not: unavailable
        card:
          type: tile
          entity: light.schlafzimmer_ambient
          name: Ambientelicht
          color: amber

      - type: heading
        heading: Bett-Modi (optional)
        icon: mdi:weather-night

      - type: conditional
        conditions:
          - entity: switch.bett_links_schnellheizen
            state_not: unavailable
        card:
          type: tile
          entity: switch.bett_links_schnellheizen
          name: Boost Links
          color: amber

      - type: conditional
        conditions:
          - entity: switch.bett_rechts_schnellheizen
            state_not: unavailable
        card:
          type: tile
          entity: switch.bett_rechts_schnellheizen
          name: Boost Rechts
          color: amber

      - type: conditional
        conditions:
          - entity: switch.bett_links_krank_modus
            state_not: unavailable
        card:
          type: tile
          entity: switch.bett_links_krank_modus
          name: Krank-Modus Links
          color: amber

      - type: conditional
        conditions:
          - entity: switch.bett_rechts_krank_modus
            state_not: unavailable
        card:
          type: tile
          entity: switch.bett_rechts_krank_modus
          name: Krank-Modus Rechts
          color: amber

      - type: conditional
        conditions:
          - entity: switch.bett_urlaub_modus
            state_not: unavailable
        card:
          type: tile
          entity: switch.bett_urlaub_modus
          name: Urlaub-Modus
          color: amber

      - type: conditional
        conditions:
          - entity: switch.bett_thermische_batterie
            state_not: unavailable
        card:
          type: tile
          entity: switch.bett_thermische_batterie
          name: Thermische Batterie
          color: amber

      - type: conditional
        conditions:
          - entity: switch.bett_tarifmodus
            state_not: unavailable
        card:
          type: tile
          entity: switch.bett_tarifmodus
          name: Tarifmodus
          color: amber

      - type: heading
        heading: Optionale Sensoren
        icon: mdi:chart-line

      - type: conditional
        conditions:
          - entity: sensor.bett_energiepreis_status
            state_not: unavailable
        card:
          type: tile
          entity: sensor.bett_energiepreis_status
          name: Energiepreis-Status
          color: amber

      - type: conditional
        conditions:
          - entity: sensor.bett_solar_anteil_heute
            state_not: unavailable
        card:
          type: tile
          entity: sensor.bett_solar_anteil_heute
          name: Solaranteil heute
          color: amber

      - type: conditional
        conditions:
          - entity: sensor.bett_heutiger_verbrauch
            state_not: unavailable
        card:
          type: tile
          entity: sensor.bett_heutiger_verbrauch
          name: Verbrauch heute
          color: amber

      - type: conditional
        conditions:
          - entity: sensor.bett_schlafscore_links
            state_not: unavailable
        card:
          type: tile
          entity: sensor.bett_schlafscore_links
          name: Schlafscore Links
          color: amber

      - type: conditional
        conditions:
          - entity: sensor.bett_schlafscore_rechts
            state_not: unavailable
        card:
          type: tile
          entity: sensor.bett_schlafscore_rechts
          name: Schlafscore Rechts
          color: amber
