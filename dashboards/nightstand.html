<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Rejuvenation · Nachttisch</title>
    <style>
      /* ─────────────────────────────────────────────────────────
         AMOLED-Nachttischwecker.
         Reines Schwarz (#000) spart auf OLED-Panels Strom und
         erzeugt den randlosen "schwebende Ziffern"-Look.
         Akzente ausschliesslich in gedecktem Bernstein — warmes
         Licht haelt die Melatoninproduktion nachts weniger auf
         als blaues.
         ───────────────────────────────────────────────────────── */
      :root {
        --bg: #000000;
        --amber: #ffb454;
        --amber-soft: #d9913f;
        --amber-deep: #8a5a1e;
        --amber-faint: #3a2610;
        --ink: #1a1206;
        --ok: #7fd98a;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--amber-soft);
        font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
        overscroll-behavior: none;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: max(24px, env(safe-area-inset-top)) 20px
          max(24px, env(safe-area-inset-bottom));
        gap: 26px;
        user-select: none;
      }

      /* ── Uhr ────────────────────────────────────────────────── */
      .clock {
        margin: auto 0;
        text-align: center;
        line-height: 0.92;
        transition: opacity 1.2s ease;
      }

      .time {
        font-size: clamp(76px, 23vw, 168px);
        font-weight: 200;
        letter-spacing: -0.03em;
        color: var(--amber);
        text-shadow: 0 0 34px rgba(255, 180, 84, 0.16);
      }

      .time .colon {
        opacity: 0.5;
        animation: blink 2s steps(1, end) infinite;
      }

      @keyframes blink {
        50% {
          opacity: 0.12;
        }
      }

      .date {
        margin-top: 12px;
        font-size: 13px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: var(--amber-deep);
      }

      /* ── Drei Tasten, wie am Bett ───────────────────────────── */
      .deck {
        width: 100%;
        max-width: 460px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-top: auto;
      }

      .key {
        position: relative;
        display: flex;
        align-items: center;
        gap: 18px;
        width: 100%;
        padding: 18px 20px;
        border: 1px solid var(--amber-faint);
        border-radius: 22px;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
        transition:
          border-color 0.25s ease,
          background 0.25s ease,
          transform 0.12s ease;
      }

      .key:active {
        transform: scale(0.985);
      }

      .key.live {
        border-color: var(--amber-deep);
        background: radial-gradient(
          120% 160% at 0% 50%,
          rgba(255, 180, 84, 0.09),
          transparent 62%
        );
      }

      .key .glyph {
        flex: 0 0 auto;
        width: 30px;
        height: 30px;
        color: var(--amber-deep);
        transition: color 0.25s ease;
      }

      .key.live .glyph {
        color: var(--amber);
      }

      .key .body {
        flex: 1 1 auto;
        min-width: 0;
      }

      .key .label {
        display: block;
        font-size: 11px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--amber-deep);
      }

      .key .value {
        display: block;
        margin-top: 3px;
        font-size: 22px;
        font-weight: 300;
        color: var(--amber-soft);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .key.live .value {
        color: var(--amber);
      }

      .key .aux {
        flex: 0 0 auto;
        font-size: 12px;
        letter-spacing: 0.1em;
        color: var(--amber-deep);
      }

      /* ── Thermostat-Overlay ─────────────────────────────────── */
      .sheet {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        padding: 28px;
        background: var(--bg);
      }

      .sheet.show {
        display: flex;
        animation: rise 0.28s ease;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
      }

      .sheet h2 {
        margin: 0;
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--amber-deep);
      }

      .dial {
        position: relative;
        width: min(78vw, 320px);
        aspect-ratio: 1;
        touch-action: none;
        border-radius: 50%;
        background: radial-gradient(
          closest-side,
          transparent 62%,
          rgba(255, 180, 84, 0.07) 88%,
          transparent 100%
        );
      }

      .dial svg {
        width: 100%;
        height: 100%;
        transform: rotate(135deg);
      }

      .dial .track {
        fill: none;
        stroke: var(--amber-faint);
        stroke-width: 10;
        stroke-linecap: round;
      }

      .dial .fill {
        fill: none;
        stroke: var(--amber);
        stroke-width: 10;
        stroke-linecap: round;
        transition: stroke-dashoffset 0.18s ease;
      }

      .dial .readout {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        pointer-events: none;
      }

      .dial .target {
        font-size: 62px;
        font-weight: 200;
        color: var(--amber);
      }

      .dial .target sup {
        font-size: 22px;
        vertical-align: super;
      }

      .dial .actual {
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--amber-deep);
      }

      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .chip {
        padding: 12px 20px;
        border: 1px solid var(--amber-faint);
        border-radius: 999px;
        background: transparent;
        color: var(--amber-soft);
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }

      .chip.primary {
        border-color: var(--amber-deep);
        color: var(--amber);
      }

      .stepper {
        display: flex;
        align-items: center;
        gap: 22px;
      }

      .stepper button {
        width: 58px;
        height: 58px;
        border: 1px solid var(--amber-faint);
        border-radius: 50%;
        background: transparent;
        color: var(--amber);
        font-size: 26px;
        font-weight: 200;
        line-height: 1;
        cursor: pointer;
      }

      .timeset {
        display: flex;
        align-items: baseline;
        gap: 6px;
        font-size: 66px;
        font-weight: 200;
        color: var(--amber);
      }

      .timeset .unit {
        padding: 0 6px;
        border-radius: 14px;
        cursor: pointer;
      }

      .timeset .unit.sel {
        background: rgba(255, 180, 84, 0.12);
      }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: min(78vw, 320px);
        height: 44px;
        background: transparent;
        cursor: pointer;
      }

      input[type="range"]::-webkit-slider-runnable-track {
        height: 8px;
        border-radius: 4px;
        background: var(--amber-faint);
      }

      input[type="range"]::-moz-range-track {
        height: 8px;
        border-radius: 4px;
        background: var(--amber-faint);
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        margin-top: -9px;
        width: 26px;
        height: 26px;
        border: none;
        border-radius: 50%;
        background: var(--amber);
        box-shadow: 0 0 14px rgba(255, 180, 84, 0.45);
      }

      input[type="range"]::-moz-range-thumb {
        width: 26px;
        height: 26px;
        border: none;
        border-radius: 50%;
        background: var(--amber);
      }

      /* ── Statuszeile + Einstellungen ────────────────────────── */
      .status {
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink);
        cursor: pointer;
      }

      .cfg {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: none;
        align-items: flex-start;
        justify-content: center;
        padding: 24px;
        overflow-y: auto;
        background: rgba(0, 0, 0, 0.94);
      }

      .cfg.show {
        display: flex;
      }

      .cfg form {
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 24px 0 40px;
      }

      .cfg label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--amber-deep);
      }

      .cfg input {
        padding: 12px 14px;
        border: 1px solid var(--amber-faint);
        border-radius: 12px;
        background: #050301;
        color: var(--amber);
        font: inherit;
        font-size: 15px;
        letter-spacing: normal;
        text-transform: none;
      }

      .cfg input:focus {
        outline: none;
        border-color: var(--amber-deep);
      }

      .hint {
        font-size: 11px;
        line-height: 1.6;
        letter-spacing: normal;
        text-transform: none;
        color: var(--ink);
      }

      /* ── Nachtruhe: Burn-in-Schutz ──────────────────────────── */
      body.dozing .deck,
      body.dozing .status {
        opacity: 0;
        pointer-events: none;
      }

      body.dozing .deck,
      body.dozing .status,
      body.dozing .clock {
        transition: opacity 1.4s ease;
      }

      body.dozing .clock {
        opacity: 0.42;
      }

      body.dozing .time {
        text-shadow: none;
      }

      /* ── Liegendes Tablet ───────────────────────────────────
         Quer ist die Mittelspalte zu schmal und laesst die Seite
         leer wirken: Uhr nach links, Tasten nach rechts. */
      @media (min-width: 820px) and (orientation: landscape) {
        body {
          flex-direction: row;
          align-items: center;
          justify-content: center;
          gap: 7vw;
          padding-bottom: 64px;
        }

        .clock {
          margin: 0;
        }

        .time {
          font-size: clamp(110px, 15vw, 200px);
        }

        .deck {
          margin-top: 0;
          max-width: 420px;
        }

        .status {
          position: absolute;
          bottom: max(20px, env(safe-area-inset-bottom));
          left: 0;
          right: 0;
          text-align: center;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="clock" id="clock">
      <div class="time">
        <span id="hh">--</span><span class="colon">:</span><span id="mm">--</span>
      </div>
      <div class="date" id="date">&nbsp;</div>
    </div>

    <div class="deck">
      <!-- 1 · Wasserbett -->
      <button class="key" id="k-bed" type="button">
        <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 17h18M3 17v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4M3 17v3M21 17v3" />
          <path d="M6 11V8a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v3" />
          <path d="M2 14c1.4 0 1.4-1.2 2.8-1.2S6.2 14 7.6 14" opacity="0.55" />
        </svg>
        <span class="body">
          <span class="label">Wasserbett</span>
          <span class="value" id="v-bed">--,-°</span>
        </span>
        <span class="aux" id="a-bed"></span>
      </button>

      <!-- 2 · Wecker -->
      <button class="key" id="k-alarm" type="button">
        <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="13" r="8" />
          <path d="M12 9v4l2.5 2M5 3 2.5 5.5M19 3l2.5 2.5" />
        </svg>
        <span class="body">
          <span class="label">Wecker</span>
          <span class="value" id="v-alarm">Aus</span>
        </span>
        <span class="aux" id="a-alarm"></span>
      </button>

      <!-- 3 · Schlafzimmerlampe -->
      <button class="key" id="k-light" type="button">
        <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 18h6M10 21h4" />
          <path d="M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8v.3h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3Z" />
        </svg>
        <span class="body">
          <span class="label">Schlafzimmerlampe</span>
          <span class="value" id="v-light">Aus</span>
        </span>
        <span class="aux" id="a-light"></span>
      </button>
    </div>

    <div class="status" id="status">&nbsp;</div>

    <!-- Thermostat -->
    <div class="sheet" id="sheet-bed">
      <h2>Wasserbett</h2>
      <div class="dial" id="dial">
        <svg viewBox="0 0 200 200">
          <circle class="track" cx="100" cy="100" r="86" id="arc-track" />
          <circle class="fill" cx="100" cy="100" r="86" id="arc-fill" />
        </svg>
        <div class="readout">
          <div class="target"><span id="d-target">--,-</span><sup>°</sup></div>
          <div class="actual" id="d-actual">Ist --,-°</div>
        </div>
      </div>
      <div class="stepper">
        <button type="button" id="t-minus" aria-label="Kälter">−</button>
        <button type="button" id="t-plus" aria-label="Wärmer">+</button>
      </div>
      <div class="row">
        <button class="chip" type="button" data-close>Fertig</button>
      </div>
    </div>

    <!-- Wecker -->
    <div class="sheet" id="sheet-alarm">
      <h2>Wecker</h2>
      <div class="timeset">
        <span class="unit sel" id="al-hh">07</span>:<span class="unit" id="al-mm">00</span>
      </div>
      <div class="stepper">
        <button type="button" id="al-minus" aria-label="Früher">−</button>
        <button type="button" id="al-plus" aria-label="Später">+</button>
      </div>
      <div class="row">
        <button class="chip primary" type="button" id="al-save">Stellen</button>
        <button class="chip" type="button" id="al-clear">Aus</button>
        <button class="chip" type="button" data-close>Zurück</button>
      </div>
    </div>

    <!-- Lampe -->
    <div class="sheet" id="sheet-light">
      <h2>Schlafzimmerlampe</h2>
      <div class="timeset"><span id="li-pct">0</span><span style="font-size: 24px">%</span></div>
      <input type="range" id="li-range" min="1" max="100" step="1" value="40" />
      <div class="row">
        <button class="chip primary" type="button" id="li-toggle">An / Aus</button>
        <button class="chip" type="button" id="li-night">Nachtlicht</button>
        <button class="chip" type="button" data-close>Zurück</button>
      </div>
    </div>

    <!-- Einstellungen -->
    <div class="cfg" id="cfg">
      <form id="cfg-form">
        <p class="hint">
          Zugriff auf Home Assistant. Der Token bleibt lokal im Browser
          (localStorage) und wird nur an die eingetragene HA-Adresse gesendet.
          Ohne Angaben läuft die Anzeige im Demomodus.
        </p>
        <label>Home-Assistant-URL<input name="haUrl" placeholder="http://homeassistant.local:8123" /></label>
        <label>Long-Lived Access Token<input name="token" type="password" placeholder="eyJhbGci…" /></label>
        <label>Climate (Wasserbett)<input name="climate" placeholder="climate.thermostat_bett" /></label>
        <label>Wecker (input_datetime)<input name="alarm" placeholder="input_datetime.wecker" /></label>
        <label>Wecker-Schalter (optional)<input name="alarmSwitch" placeholder="input_boolean.wecker_aktiv" /></label>
        <label>Lampe<input name="light" placeholder="light.schlafzimmer" /></label>
        <label>Min. Temperatur °C<input name="tempMin" inputmode="decimal" placeholder="20" /></label>
        <label>Max. Temperatur °C<input name="tempMax" inputmode="decimal" placeholder="40" /></label>
        <div class="row">
          <button class="chip primary" type="submit">Speichern</button>
          <button class="chip" type="button" id="cfg-cancel">Abbrechen</button>
        </div>
      </form>
    </div>

    <script>
      "use strict";

      const $ = (id) => document.getElementById(id);
      const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
      const pad = (n) => String(n).padStart(2, "0");

      /* ── Konfiguration ─────────────────────────────────────── */
      const CFG_KEY = "rejuvenation.nightstand.v2";
      const DEFAULTS = {
        haUrl: "",
        token: "",
        climate: "",
        alarm: "",
        alarmSwitch: "",
        light: "",
        tempMin: "20",
        tempMax: "40",
      };

      function loadCfg() {
        try {
          return { ...DEFAULTS, ...JSON.parse(localStorage.getItem(CFG_KEY) || "{}") };
        } catch {
          return { ...DEFAULTS };
        }
      }

      let cfg = loadCfg();
      const isLive = () => Boolean(cfg.haUrl && cfg.token);
      const tempMin = () => parseFloat(cfg.tempMin) || 20;
      const tempMax = () => parseFloat(cfg.tempMax) || 40;

      /* ── Home-Assistant-REST ───────────────────────────────── */
      async function haGet(entity) {
        if (!isLive() || !entity) return null;
        try {
          const r = await fetch(`${cfg.haUrl}/api/states/${entity}`, {
            headers: { Authorization: `Bearer ${cfg.token}` },
          });
          return r.ok ? await r.json() : null;
        } catch {
          return null;
        }
      }

      async function haCall(domain, service, data) {
        if (!isLive()) return false;
        try {
          const r = await fetch(`${cfg.haUrl}/api/services/${domain}/${service}`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${cfg.token}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify(data),
          });
          return r.ok;
        } catch {
          return false;
        }
      }

      /* ── Demozustand ───────────────────────────────────────── */
      const demo = {
        climate: {
          state: "heat",
          attributes: {
            current_temperature: 28.6,
            temperature: 30,
            hvac_action: "heating",
          },
        },
        alarm: { state: "07:00:00" },
        alarmSwitch: { state: "on" },
        light: { state: "off", attributes: { brightness: 96 } },
      };

      /* ── Uhr ───────────────────────────────────────────────── */
      const TAGE = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
      const MONATE = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];

      function paintClock() {
        const now = new Date();
        $("hh").textContent = pad(now.getHours());
        $("mm").textContent = pad(now.getMinutes());
        $("date").textContent =
          `${TAGE[now.getDay()]} · ${now.getDate()}. ${MONATE[now.getMonth()]}`;
        driftClock(now);
      }

      /* Burn-in-Schutz: die Ziffern wandern minütlich ein paar
         Pixel, damit sich auf einem OLED-Panel nichts einbrennt,
         wenn das Display die ganze Nacht dieselbe Zeit zeigt. */
      let driftMinute = -1;
      function driftClock(now) {
        if (now.getMinutes() === driftMinute) return;
        driftMinute = now.getMinutes();
        const phase = (now.getHours() * 60 + driftMinute) / 12;
        const dx = Math.sin(phase) * 9;
        const dy = Math.cos(phase * 0.7) * 7;
        $("clock").style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
      }

      /* Nachtruhe: ohne Berührung dimmt die Oberflaeche nach
         45 s auf die blosse Uhrzeit herunter. Eine Beruehrung
         irgendwo weckt sie wieder auf. */
      let dozeTimer = null;
      function scheduleDoze() {
        clearTimeout(dozeTimer);
        document.body.classList.remove("dozing");
        dozeTimer = setTimeout(() => document.body.classList.add("dozing"), 45000);
      }

      function wake(event) {
        const wasDozing = document.body.classList.contains("dozing");
        scheduleDoze();
        /* Die erste Berührung weckt nur auf, sie loest nichts aus. */
        if (wasDozing && event) {
          event.stopPropagation();
          event.preventDefault();
        }
        return wasDozing;
      }

      ["pointerdown", "keydown"].forEach((evt) =>
        document.addEventListener(evt, wake, true),
      );

      /* ── Wasserbett ────────────────────────────────────────── */
      const ARC = 2 * Math.PI * 86;
      const SWEEP = 0.75; /* 270°-Bogen, oben offen */
      let bedState = null;
      let pendingTarget = null;
      let pushTimer = null;

      $("arc-track").style.strokeDasharray = `${ARC * SWEEP} ${ARC}`;
      $("arc-fill").style.strokeDasharray = `${ARC * SWEEP} ${ARC}`;

      const fmtTemp = (v) =>
        v == null || isNaN(v) ? "--,-" : v.toFixed(1).replace(".", ",");

      function currentTarget() {
        if (pendingTarget != null) return pendingTarget;
        const t = bedState && bedState.attributes && bedState.attributes.temperature;
        return typeof t === "number" ? t : null;
      }

      function paintBed() {
        const attrs = (bedState && bedState.attributes) || {};
        const actual = attrs.current_temperature;
        const target = currentTarget();
        const heating = attrs.hvac_action === "heating";
        const off = bedState && (bedState.state === "off" || bedState.state === "unavailable");

        $("v-bed").textContent = off ? "Aus" : `${fmtTemp(actual)}°`;
        $("a-bed").textContent = off ? "" : heating ? "heizt" : `Ziel ${fmtTemp(target)}°`;
        $("k-bed").classList.toggle("live", Boolean(heating));

        $("d-target").textContent = fmtTemp(target);
        $("d-actual").textContent = `Ist ${fmtTemp(actual)}°`;

        const span = tempMax() - tempMin();
        const frac = target == null || span <= 0 ? 0 : clamp((target - tempMin()) / span, 0, 1);
        $("arc-fill").style.strokeDashoffset = String(ARC * SWEEP * (1 - frac));
      }

      function setTarget(value) {
        const step = 0.5;
        pendingTarget = clamp(Math.round(value / step) * step, tempMin(), tempMax());
        paintBed();
        clearTimeout(pushTimer);
        pushTimer = setTimeout(async () => {
          const value = pendingTarget;
          if (cfg.climate) {
            await haCall("climate", "set_temperature", {
              entity_id: cfg.climate,
              temperature: value,
            });
          } else if (!isLive()) {
            demo.climate.attributes.temperature = value;
          }
          pendingTarget = null;
          refresh();
        }, 600);
      }

      $("t-plus").addEventListener("click", () => setTarget((currentTarget() ?? tempMin()) + 0.5));
      $("t-minus").addEventListener("click", () => setTarget((currentTarget() ?? tempMin()) - 0.5));

      /* Ziehen auf dem Ring — der Bogen laeuft von 135° bis 405°. */
      const dial = $("dial");
      let dragging = false;

      function angleToTemp(event) {
        const box = dial.getBoundingClientRect();
        const x = event.clientX - (box.left + box.width / 2);
        const y = event.clientY - (box.top + box.height / 2);
        let deg = (Math.atan2(y, x) * 180) / Math.PI - 135;
        while (deg < 0) deg += 360;
        if (deg > 270) return null; /* in der offenen Luecke: ignorieren */
        return tempMin() + (deg / 270) * (tempMax() - tempMin());
      }

      function onDrag(event) {
        const temp = angleToTemp(event);
        if (temp != null) setTarget(temp);
      }

      dial.addEventListener("pointerdown", (event) => {
        dragging = true;
        dial.setPointerCapture(event.pointerId);
        onDrag(event);
      });
      dial.addEventListener("pointermove", (event) => dragging && onDrag(event));
      dial.addEventListener("pointerup", () => (dragging = false));
      dial.addEventListener("pointercancel", () => (dragging = false));

      /* ── Wecker ────────────────────────────────────────────── */
      let alarmState = null;
      let alarmSwitchState = null;
      let editHH = 7;
      let editMM = 0;
      let editUnit = "hh";

      function parseAlarm(state) {
        if (!state || !state.state) return null;
        const attrs = state.attributes || {};
        if (typeof attrs.hour === "number" && typeof attrs.minute === "number") {
          return { hh: attrs.hour, mm: attrs.minute };
        }
        const match = /(\d{1,2}):(\d{2})/.exec(state.state);
        return match ? { hh: +match[1], mm: +match[2] } : null;
      }

      function alarmActive() {
        if (!cfg.alarmSwitch && isLive()) return Boolean(parseAlarm(alarmState));
        return alarmSwitchState ? alarmSwitchState.state === "on" : Boolean(parseAlarm(alarmState));
      }

      function paintAlarm() {
        const time = parseAlarm(alarmState);
        const active = Boolean(time) && alarmActive();
        $("v-alarm").textContent = time ? `${pad(time.hh)}:${pad(time.mm)}` : "Aus";
        $("k-alarm").classList.toggle("live", active);
        $("a-alarm").textContent = active ? countdown(time) : time ? "aus" : "";
      }

      function countdown(time) {
        const now = new Date();
        const next = new Date(now);
        next.setHours(time.hh, time.mm, 0, 0);
        if (next <= now) next.setDate(next.getDate() + 1);
        const mins = Math.round((next - now) / 60000);
        const h = Math.floor(mins / 60);
        return h > 0 ? `in ${h} h ${mins % 60} min` : `in ${mins} min`;
      }

      function paintAlarmSheet() {
        $("al-hh").textContent = pad(editHH);
        $("al-mm").textContent = pad(editMM);
        $("al-hh").classList.toggle("sel", editUnit === "hh");
        $("al-mm").classList.toggle("sel", editUnit === "mm");
      }

      function nudgeAlarm(delta) {
        if (editUnit === "hh") editHH = (editHH + delta + 24) % 24;
        else editMM = (editMM + delta * 5 + 60) % 60;
        paintAlarmSheet();
      }

      $("al-hh").addEventListener("click", () => ((editUnit = "hh"), paintAlarmSheet()));
      $("al-mm").addEventListener("click", () => ((editUnit = "mm"), paintAlarmSheet()));
      $("al-plus").addEventListener("click", () => nudgeAlarm(1));
      $("al-minus").addEventListener("click", () => nudgeAlarm(-1));

      $("al-save").addEventListener("click", async () => {
        const time = `${pad(editHH)}:${pad(editMM)}:00`;
        if (cfg.alarm) {
          await haCall("input_datetime", "set_datetime", {
            entity_id: cfg.alarm,
            time,
          });
        } else if (!isLive()) {
          demo.alarm.state = time;
        }
        if (cfg.alarmSwitch) {
          await haCall("input_boolean", "turn_on", { entity_id: cfg.alarmSwitch });
        } else if (!isLive()) {
          demo.alarmSwitch.state = "on";
        }
        closeSheets();
        refresh();
      });

      $("al-clear").addEventListener("click", async () => {
        if (cfg.alarmSwitch) {
          await haCall("input_boolean", "turn_off", { entity_id: cfg.alarmSwitch });
        } else if (!isLive()) {
          demo.alarmSwitch.state = "off";
        }
        closeSheets();
        refresh();
      });

      /* ── Lampe ─────────────────────────────────────────────── */
      let lightState = null;

      const pctFromBrightness = (b) =>
        typeof b === "number" ? Math.max(1, Math.round((b / 255) * 100)) : 0;

      function paintLight() {
        const on = lightState && lightState.state === "on";
        const pct = on ? pctFromBrightness((lightState.attributes || {}).brightness) : 0;
        $("v-light").textContent = on ? (pct ? `An · ${pct} %` : "An") : "Aus";
        $("k-light").classList.toggle("live", Boolean(on));
        $("a-light").textContent = on ? "" : "aus";
        $("li-pct").textContent = String(pct || 0);
        if (pct) $("li-range").value = String(pct);
      }

      async function setBrightness(pct) {
        $("li-pct").textContent = String(pct);
        if (cfg.light) {
          await haCall("light", "turn_on", {
            entity_id: cfg.light,
            brightness_pct: pct,
          });
        } else if (!isLive()) {
          demo.light.state = "on";
          demo.light.attributes.brightness = Math.round((pct / 100) * 255);
        }
      }

      let brightTimer = null;
      $("li-range").addEventListener("input", (event) => {
        const pct = +event.target.value;
        $("li-pct").textContent = String(pct);
        clearTimeout(brightTimer);
        brightTimer = setTimeout(() => setBrightness(pct).then(refresh), 250);
      });

      $("li-toggle").addEventListener("click", async () => {
        if (cfg.light) {
          await haCall("light", "toggle", { entity_id: cfg.light });
        } else if (!isLive()) {
          demo.light.state = demo.light.state === "on" ? "off" : "on";
        }
        refresh();
      });

      /* Nachtlicht: 1 % in warmem Bernstein — genug, um den Weg
         zu sehen, ohne wach zu werden. */
      $("li-night").addEventListener("click", async () => {
        if (cfg.light) {
          await haCall("light", "turn_on", {
            entity_id: cfg.light,
            brightness_pct: 1,
            kelvin: 2000,
          });
        } else if (!isLive()) {
          demo.light.state = "on";
          demo.light.attributes.brightness = 3;
        }
        closeSheets();
        refresh();
      });

      /* ── Overlays ──────────────────────────────────────────── */
      function openSheet(id) {
        closeSheets();
        $(id).classList.add("show");
      }

      function closeSheets() {
        document.querySelectorAll(".sheet.show").forEach((el) => el.classList.remove("show"));
      }

      document.querySelectorAll("[data-close]").forEach((btn) =>
        btn.addEventListener("click", closeSheets),
      );

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeSheets();
          $("cfg").classList.remove("show");
        }
      });

      $("k-bed").addEventListener("click", () => openSheet("sheet-bed"));
      $("k-light").addEventListener("click", () => openSheet("sheet-light"));
      $("k-alarm").addEventListener("click", () => {
        const time = parseAlarm(alarmState);
        if (time) {
          editHH = time.hh;
          editMM = time.mm;
        }
        editUnit = "hh";
        paintAlarmSheet();
        openSheet("sheet-alarm");
      });

      /* ── Einstellungen ─────────────────────────────────────── */
      const form = $("cfg-form");

      $("status").addEventListener("click", () => {
        Object.keys(DEFAULTS).forEach((key) => {
          if (form.elements[key]) form.elements[key].value = cfg[key] || "";
        });
        $("cfg").classList.add("show");
      });

      $("cfg-cancel").addEventListener("click", () => $("cfg").classList.remove("show"));

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const next = { ...DEFAULTS };
        Object.keys(DEFAULTS).forEach((key) => {
          if (form.elements[key]) next[key] = form.elements[key].value.trim();
        });
        next.haUrl = next.haUrl.replace(/\/+$/, "");
        cfg = next;
        localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
        $("cfg").classList.remove("show");
        refresh();
      });

      /* ── Aktualisierung ────────────────────────────────────── */
      async function refresh() {
        if (isLive()) {
          const [climate, alarm, alarmSwitch, light] = await Promise.all([
            haGet(cfg.climate),
            haGet(cfg.alarm),
            haGet(cfg.alarmSwitch),
            haGet(cfg.light),
          ]);
          bedState = climate;
          alarmState = alarm;
          alarmSwitchState = alarmSwitch;
          lightState = light;
          $("status").textContent =
            `${cfg.haUrl.replace(/^https?:\/\//, "")} · ${new Date().toLocaleTimeString("de-DE")}`;
        } else {
          bedState = demo.climate;
          alarmState = demo.alarm;
          alarmSwitchState = demo.alarmSwitch;
          lightState = demo.light;
          $("status").textContent = "Demomodus · tippen zum Einrichten";
        }
        paintBed();
        paintAlarm();
        paintLight();
      }

      paintClock();
      paintAlarmSheet();
      refresh();
      scheduleDoze();
      setInterval(paintClock, 1000);
      setInterval(refresh, 15000);
    </script>
  </body>
</html>
